[package]
name = "ipg-fuzz-support"
version = "0.0.0"
publish = false
license = "AGPL-3.0-or-later"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing", "openpgp"]
fuzzing = []
openpgp = ["iron-privacy-guard/openpgp"]

[dependencies]
iron-privacy-guard = { package = "ipg", path = "..", features = ["fuzzing"] }
serde_json = "1"
libfuzzer-sys = "=0.4.13"

[workspace]
members = ["."]

[[bin]]
name = "openpgp_packets"
path = "fuzz_targets/openpgp_packets.rs"
required-features = ["openpgp", "fuzzing"]
test = false
doc = false
bench = false

[[bin]]
name = "stream_headers"
path = "fuzz_targets/stream_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tpm_structures"
path = "fuzz_targets/tpm_structures.rs"
test = false
doc = false
bench = false

[[bin]]
name = "requests"
path = "fuzz_targets/requests.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "artifacts"
path = "fuzz_targets/artifacts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp"
path = "fuzz_targets/mcp.rs"
test = false
doc = false
bench = false
