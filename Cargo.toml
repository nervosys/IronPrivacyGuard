[package]
name = "ipg"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Agent-first privacy CLI and discoverable cryptographic workflows on IronCrypto"
repository = "https://github.com/nervosys/IronPrivacyGuard"
homepage = "https://github.com/nervosys/IronPrivacyGuard"
readme = "README.md"
keywords = ["cryptography", "agents", "mcp", "pkcs11", "hsm"]
categories = ["command-line-utilities", "cryptography"]
# Repository-only assets; crates.io resolves README links through `repository`.
exclude = ["media/", ".github/", "fuzz/"]

[lib]
name = "iron_privacy_guard"

[[bin]]
name = "ipg"
path = "src/main.rs"

[dependencies]
ic-core = "=0.2.20"
ic-cipher = "=0.2.20"
ic-ec = "=0.2.20"
ic-hash = "=0.2.20"
ic-kdf = "=0.2.20"
ic-mac = "=0.2.20"
ic-mlkem = "=0.2.20"
ic-mldsa = "=0.2.20"
ic-ontology = "=0.2.20"
ic-drbg = "=0.2.20"
ic-hpke = "=0.2.20"
ipg-json = { path = "crates/ipg-json", version = "0.1.0" }
ipg-pkcs11 = { path = "crates/ipg-pkcs11", version = "0.1.0", optional = true }
# TPM attestation verification: native certificate paths over IronCrypto.
ic-rsa = { version = "=0.2.20", optional = true }
ic-pkix = { version = "=0.2.20", optional = true }
ironsocketlayer = { version = "=0.3.2", optional = true }

# Native TPM device access on Linux; Windows FFI isolated in crates/ipg-cng.
[target.'cfg(windows)'.dependencies]
ipg-cng = { version = "=0.1.2", path = "crates/ipg-cng", optional = true }

[workspace]
members = ["crates/ipg-cng", "crates/ipg-json", "crates/ipg-derive", "crates/ipg-pkcs11"]

[features]
default = ["openpgp-native"]
# In-memory parser oracles for fuzz tooling; never enables TPM access.
fuzzing = ["attestation"]
# Hardware-backed identities through a host-configured PKCS#11 module. Loads
# vendor code at runtime only; no C compilation and no effect on contracts.
pkcs11 = ["dep:ipg-pkcs11"]
# TPM 2.0 identities through native device/TBS commands, plus Windows CNG
# compatibility for existing persisted key references.
tpm = ["dep:ipg-cng", "attestation"]
# Verify TPM key attestations (EK certificate chains, TPM2_Certify evidence and
# credential activation) without a TPM.
attestation = ["x509-native"]
# Offline certificate-path and TLS server-identity checks; not a TLS transport.
x509-native = ["dep:ic-rsa", "dep:ic-pkix"]
# AWS KMS keys over IronSocketLayer's TLS 1.3 client and bundled public roots.
kms = ["dep:ironsocketlayer"]
# OpenPGP (RFC 9580 v4/v6) keys, certificates, messages and signatures for GnuPG
# interoperability, natively over IronCrypto, including LibrePGP v5 certificates.
openpgp-native = ["dep:ic-rsa"]
# Compatibility alias for builds that selected the former rPGP backend.
openpgp = ["openpgp-native"]

[profile.release]
lto = true
strip = true
overflow-checks = true

[profile.test]
opt-level = 2
