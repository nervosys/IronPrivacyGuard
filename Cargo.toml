[package]
name = "ipg"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Agent-first privacy CLI and discoverable cryptographic workflows on IronCrypto"
repository = "https://github.com/nervosys/IronPrivacyGuard"
homepage = "https://github.com/nervosys/IronPrivacyGuard"
readme = "README.md"
keywords = ["cryptography", "agents", "mcp", "pkcs11", "hsm"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "iron_privacy_guard"

[[bin]]
name = "ipg"
path = "src/main.rs"

[dependencies]
ic-core = "=0.2.7"
ic-cipher = "=0.2.7"
ic-ec = "=0.2.7"
ic-hash = "=0.2.7"
ic-kdf = "=0.2.7"
ic-mac = "=0.2.7"
ic-mlkem = "=0.2.7"
ic-mldsa = "=0.2.7"
ic-ontology = "=0.2.7"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
cryptoki = { version = "0.12", optional = true }
secrecy = { version = "0.10", optional = true }
ic-rustls = { version = "=0.2.7", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
# OpenPGP compatibility boundary. rPGP is pinned exactly: it supplies its own
# (RustCrypto) primitives, and IPG adds certificate-validity policy on top.
pgp = { version = "=0.20.0", default-features = false, optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
# TPM attestation verification: IronCrypto RSA and rustls-webpki path validation
# (with IronCrypto's signature algorithms) for endorsement-key certificate chains.
ic-rsa = { version = "=0.2.7", optional = true }
ic-pkix = { version = "=0.2.7", optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"], optional = true }
pki-types = { package = "rustls-pki-types", version = "1", optional = true }

# TPM access: the system TPM2 software stack (tpm2-tss) on Linux, CNG's Platform
# Crypto Provider on Windows (FFI isolated in crates/ipg-cng).
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "7", optional = true }

[target.'cfg(windows)'.dependencies]
ipg-cng = { version = "=0.1.1", path = "crates/ipg-cng", optional = true }

[workspace]
members = ["crates/ipg-cng"]

[features]
default = []
# In-memory parser oracles for fuzz tooling; never enables TPM access.
fuzzing = ["attestation"]
# Hardware-backed identities through a host-configured PKCS#11 module. Loads
# vendor code at runtime only; no C compilation and no effect on contracts.
pkcs11 = ["dep:cryptoki", "dep:secrecy"]
# TPM 2.0 identities: tpm2-tss (ESAPI) on Linux, linking libtss2 dynamically; the
# Microsoft Platform Crypto Provider on Windows.
tpm = ["dep:tss-esapi", "dep:ipg-cng", "attestation"]
# Verify TPM key attestations (EK certificate chains, TPM2_Certify evidence and
# credential activation) without a TPM.
attestation = ["dep:ic-rsa", "dep:ic-pkix", "dep:webpki", "dep:pki-types", "dep:ic-rustls"]
# AWS KMS keys over TLS from rustls with IronCrypto's provider; no C compilation.
kms = ["dep:ic-rustls", "dep:rustls", "dep:webpki-roots"]
# OpenPGP (RFC 9580 v4/v6) keys, messages and signatures for GnuPG interoperability,
# through rPGP. Pure Rust; bzip2 decompression is not included.
openpgp = ["dep:pgp", "dep:rand_core"]

[profile.release]
lto = true
strip = true
overflow-checks = true

[profile.test]
opt-level = 2
