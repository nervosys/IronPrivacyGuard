name: Fuzz smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [requests, framing, artifacts, mcp, stream_headers, tpm_structures]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: mkdir -p fuzz/corpus/${{ matrix.target }}
      - if: matrix.target == 'stream_headers'
        run: python3 scripts/fuzz-large-headers.py
      - run: cargo +nightly fuzz run --target-dir target/fuzz ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- -runs=10000 -max_total_time=45 -max_len=${{ matrix.target == 'stream_headers' && '1048588' || '65537' }} -timeout=10 -rss_limit_mb=2048
        env:
          CARGO_NET_OFFLINE: true
      - run: git diff --exit-code -- fuzz/Cargo.lock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-failures
          path: fuzz/artifacts/
          if-no-files-found: ignore
