name: Rust
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features pkcs11,kms,openpgp,attestation -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features fuzzing,openpgp --test fuzz_regressions
      - run: cargo test --locked --features pkcs11,kms,openpgp,attestation
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --all-targets --features tpm,pkcs11,kms,openpgp -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo test --locked --features tpm
      - run: cargo build --release --locked --features kms,openpgp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/interop/requirements.txt
      - run: python scripts/fuzz-openpgp-policy-seeds.py --check
      - run: python tests/interop/schema_contracts.py
      - run: python tests/interop/mcp_client.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/crypto_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/stream_signature_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/p384_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/hybrid_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/p384_mldsa_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/stream_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/kms_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      # GnuPG ships on the Linux and Windows runners (Git for Windows); macOS runners lack it.
      - if: runner.os != 'macOS'
        run: python tests/interop/gnupg_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/openpgp_v6_reference.py --apg target/release/apg${{ runner.os == 'Windows' && '.exe' || '' }}
  tpm:
    # Full TPM lifecycle against a throwaway swtpm software TPM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools libtss2-dev pkg-config
      - run: cargo clippy --locked --all-targets --features tpm,pkcs11,kms -- -D warnings
      - run: bash scripts/tpm-test.sh
  softhsm:
    # Full hardware lifecycle against a disposable SoftHSMv2 token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y softhsm2
      - run: bash scripts/softhsm-test.sh
