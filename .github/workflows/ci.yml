name: Rust
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --features openpgp-native --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features pkcs11,kms,openpgp,attestation -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features x509-native --test x509_server
      - run: cargo test --locked --no-default-features --features tls-native
      - run: cargo clippy --locked --no-default-features --features tls-native --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features --features openpgp-native
      - run: cargo test --locked --features fuzzing,openpgp --test fuzz_regressions
      - run: cargo test --locked --features pkcs11,kms,openpgp,attestation
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --all-targets --features tpm,pkcs11,kms,openpgp -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo test --locked --features tpm
      - run: cargo build --release --locked --features kms,openpgp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/interop/requirements.txt
      - run: python scripts/check-openpgp-native-deps.py
      - run: python scripts/check-ironcrypto-only.py
      - run: python scripts/check-ironcrypto-only.py --no-default-features
      - run: python scripts/check-ironcrypto-only.py --features pkcs11
      - run: python scripts/check-ironcrypto-only.py --features tpm,pkcs11
      - run: python scripts/check-ironcrypto-only.py --no-default-features --features x509-native
      - run: python scripts/check-ironcrypto-only.py --no-default-features --features tls-native
      - run: python scripts/check-ironcrypto-only.py --features kms
      - run: python scripts/check-ironcrypto-only.py --all-features
      - run: cargo build --locked --no-default-features --features tls-native --example native_tls_probe
      - run: python scripts/test-native-tls.py target/debug/examples/native_tls_probe${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python scripts/test-native-tls-handshake.py target/debug/examples/native_tls_probe${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python scripts/fuzz-openpgp-policy-seeds.py --check
      - run: python scripts/fuzz-openpgp-large-certificates.py
      - run: python scripts/fuzz-openpgp-large-certificates.py --check
      - run: python tests/interop/schema_contracts.py
      - run: python tests/interop/json_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/mcp_client.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/interop/node/package-lock.json
      - run: npm ci --prefix tests/interop/node --ignore-scripts --no-fund --no-audit
      - run: node tests/interop/node/mcp_client.mjs --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/crypto_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/stream_signature_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/p384_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/hybrid_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/p384_mldsa_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/stream_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/kms_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/kms_tls_rejection.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      # GnuPG ships on the Linux and Windows runners (Git for Windows); macOS runners lack it.
      - if: runner.os != 'macOS'
        run: python tests/interop/gnupg_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/openpgp_v6_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/openpgp_recipient_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/delegation_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/interop/message_reference.py --ipg target/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
      - if: runner.os != 'macOS'
        run: cargo build --release --locked --no-default-features --features openpgp-native --target-dir target/native
      - if: runner.os != 'macOS'
        run: python tests/interop/openpgp_native_reference.py --ipg target/native/release/ipg${{ runner.os == 'Windows' && '.exe' || '' }}
  tpm:
    # Full TPM lifecycle against a throwaway swtpm software TPM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools
      - run: cargo clippy --locked --all-targets --features tpm,pkcs11,kms -- -D warnings
      - run: bash scripts/tpm-test.sh
  softhsm:
    # Full hardware lifecycle against a disposable SoftHSMv2 token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y softhsm2
      - run: bash scripts/softhsm-test.sh
